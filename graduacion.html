<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraceBoaco. - Anillos de Graduación</title>

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/grace_logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/grace_logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/grace_logo.png">
    <link rel="shortcut icon" href="/grace_logo.png">

    <!-- SEO & Social Meta Tags -->
    <link rel="canonical" href="https://joyeriagrace.com/graduacion.html">
    <meta name="description" content="Colección Anillos de Graduación - GraceBoaco. Bachiller, Universidad, 6to Grado y Preescolar.">
    <meta property="og:title" content="Anillos de Graduación - GraceBoaco">
    <meta property="og:description" content="Celebra tus logros con nuestra línea exclusiva de anillos de graduación.">
    <meta property="og:image" content="/grace_logo.png">
    <meta property="og:url" content="https://joyeriagrace.com/graduacion.html">
    <meta property="og:type" content="website">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">

    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Project Styles -->
    <link rel="stylesheet" href="/src/style.css">
    <style>
        /* Hide prices ONLY in graduation product grid cards */
        .hide-prices-page .products-grid .price-container {
            display: none !important;
        }
    </style>
</head>

<body class="hide-prices-page">
    <!-- Header Placeholder -->
    <div id="header-part"></div>

    <main id="main-content" class="category-page premium-nav-page">
        <!-- Hero Category Section -->
        <section class="category-hero grad-hero">
            <div class="category-hero-content">
                <h1 class="hero-title">Colección Graduación</h1>
                <p class="hero-subtitle">Celebra tus logros con nuestra línea exclusiva de anillos.</p>
            </div>
        </section>

        <!-- Subcategory Navigation -->
        <div class="subcategory-tabs">
            <div class="tabs-container">
                <!-- Bachiller -->
                <div class="dropdown-tab">
                    <button class="tab-btn dropdown-toggle">Anillos Bachiller <ion-icon
                            name="chevron-down-outline"></ion-icon></button>
                    <div class="dropdown-menu">
                        <button class="tab-btn sub-tab-btn" data-target="bachiller-dama">Para Dama</button>
                        <button class="tab-btn sub-tab-btn" data-target="bachiller-caballero">Para Caballero</button>
                    </div>
                </div>

                <!-- Carreras (NUEVO) -->
                <div class="dropdown-tab">
                    <button class="tab-btn dropdown-toggle">Anillos Carreras <ion-icon
                            name="chevron-down-outline"></ion-icon></button>
                    <div class="dropdown-menu">
                        <button class="tab-btn sub-tab-btn" data-target="carreras-dama">Para Dama</button>
                        <button class="tab-btn sub-tab-btn" data-target="carreras-caballero">Para Caballero</button>
                    </div>
                </div>

                <!-- 6to Grado -->
                <div class="dropdown-tab">
                    <button class="tab-btn dropdown-toggle">Anillos 6to Grado <ion-icon
                            name="chevron-down-outline"></ion-icon></button>
                    <div class="dropdown-menu">
                        <button class="tab-btn sub-tab-btn" data-target="sexto-dama">Para Dama</button>
                        <button class="tab-btn sub-tab-btn" data-target="sexto-caballero">Para Caballero</button>
                    </div>
                </div>

                <!-- Preescolar -->
                <div class="dropdown-tab">
                    <button class="tab-btn dropdown-toggle">Anillos Preescolar <ion-icon
                            name="chevron-down-outline"></ion-icon></button>
                    <div class="dropdown-menu">
                        <button class="tab-btn sub-tab-btn" data-target="preescolar-dama">Para Niña</button>
                        <button class="tab-btn sub-tab-btn" data-target="preescolar-caballero">Para Niño</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dynamic Product Area -->
        <section class="category-products">
            <div class="section-title-wrap">
                <h2 class="section-title" id="current-category-title">Anillos de Dama</h2>
            </div>

            <div class="products-grid" id="graduacion-grid">
                <!-- Products will be injected via JS -->
            </div>
        </section>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-part"></div>
    <!-- Modals Placeholder -->
    <div id="modals-part"></div>

    <!-- Modular Entry Script -->
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/js/category.js"></script>
</body>

</html>
